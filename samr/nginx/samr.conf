# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=iot_zone:10m rate=100r/m;

# Upstreams
upstream auth_service { server auth-service:8001; }
upstream patient_service { server patient-service:8002; }
upstream solicitud_service { server solicitud-service:8003; }
upstream monitoring_service { server monitoring-service:8004; }
upstream evaluacion_service { server evaluacion-service:8005; }
upstream teleconsult_service { server teleconsult-service:8006; }
upstream emergency_service { server emergency-service:8007; }
upstream cierre_caso_service { server cierre-caso-service:8008; }
upstream historial_interop_service { server historial-interop-service:8009; }
upstream audit_service { server audit-service:8010; }
upstream admin_integracion_service { server admin-integracion-service:8011; }
upstream notification_service { server notification-service:8012; }

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_protocols TLSv1.3;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Global Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # WAF basic rule
    if ($request_uri ~* "union|select|insert|drop|delete|--|;|<script") {
        return 403;
    }

    access_log /var/log/nginx/access.log;

    # API Routing
    location /api/auth/login/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://auth_service;
    }

    location /api/auth/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://auth_service;
    }

    location /api/patients/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://patient_service;
    }

    location /api/solicitud/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://solicitud_service;
    }

    location /api/monitoring/iot-events/ {
        limit_req zone=iot_zone burst=50 nodelay;
        proxy_pass http://monitoring_service;
    }

    location /api/monitoring/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://monitoring_service;
    }

    location /api/evaluacion/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://evaluacion_service;
    }

    location /api/teleconsult/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://teleconsult_service;
    }

    location /api/emergencies/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://emergency_service;
    }

    location /api/cierre-caso/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://cierre_caso_service;
    }

    location /api/history/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://historial_interop_service;
    }

    location /api/historial/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://historial_interop_service;
    }

    location /api/audit/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://audit_service;
    }

    location /api/admin/ {
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass http://admin_integracion_service;
    }

    # WebSockets
    location /ws/monitoring/ {
        proxy_pass http://monitoring_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /ws/teleconsult/ {
        proxy_pass http://teleconsult_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
