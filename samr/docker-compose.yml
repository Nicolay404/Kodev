      service: cierre-caso-service
    container_name: samr-cierre-caso-consumer
    command: ["python", "manage.py", "consume_events"]
    depends_on: [postgres, rabbitmq]

  historial-worker:
    extends:
      service: historial-interop-service
    container_name: samr-historial-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on: [postgres, rabbitmq, redis]

  historial-consumer:
