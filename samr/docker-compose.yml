      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,admin-integracion-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  solicitud-worker:
    extends:
      service: solicitud-service
    container_name: samr-solicitud-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on: [postgres, rabbitmq, redis]

  solicitud-consumer:
    extends:
      service: solicitud-service
    container_name: samr-solicitud-consumer
