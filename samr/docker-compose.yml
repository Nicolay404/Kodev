networks:
  samr-net:
    driver: bridge

volumes:
  pgdata:

x-django-service: &django-service
  networks:
    - samr-net
  volumes:
    - ./keys/public.pem:/keys/public.pem:ro
  environment:
    DB_HOST: samr-postgres
    POSTGRES_HOST: samr-postgres
    DB_PORT: "5432"
    RABBITMQ_URL: ${RABBITMQ_URL}
    DB_PASSWORD: ${DB_PASSWORD}
  restart: on-failure
  healthcheck:
    test: ["CMD-SHELL", "python manage.py health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  postgres:
    image: postgres:16
    container_name: samr-postgres
    networks:
      samr-net:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: samr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro

  redis:
    image: redis:7.2-alpine
    container_name: samr-redis
    networks:
      - samr-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: samr-rabbitmq
    networks:
      - samr-net
    ports:
      - "15672:15672"

  nginx:
    image: nginx:1.26-alpine
    container_name: samr-nginx
    networks:
      - samr-net
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/samr.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - notification-service
      - patient-service
      - solicitud-service
      - monitoring-service
      - evaluacion-service
      - teleconsult-service
      - emergency-service
      - cierre-caso-service
      - historial-interop-service
      - audit-service
      - admin-integracion-service

  bff-service:
    build: ./bff/bff-service
    container_name: samr-bff
    networks:
      - samr-net
    ports:
      - "8000:8000"
    depends_on:
      - nginx
    environment:
      API_GATEWAY_URL: "https://nginx"
      JWT_PUBLIC_KEY_PATH: "/keys/public.pem"
      VERIFY_GATEWAY_TLS: "false"
      BFF_ALLOWED_ORIGINS: "${BFF_ALLOWED_ORIGINS:-http://localhost:5173}"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro

  auth-service:
    <<: *django-service
    build: ./services/auth-service
    container_name: samr-auth
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,auth-service
    volumes:
      - ./keys:/keys:ro

  notification-service:
    <<: *django-service
    build: ./services/notification-service
    container_name: samr-notification
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      MVP_NOTIFICATION_BACKEND: ${MVP_NOTIFICATION_BACKEND}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,notification-service

  notification-worker:
    <<: *django-service
    build: ./services/notification-service
    container_name: samr-notification-worker
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=1"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      MVP_NOTIFICATION_BACKEND: ${MVP_NOTIFICATION_BACKEND}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,notification-service

  notification-consumer:
    <<: *django-service
    build: ./services/notification-service
    container_name: samr-notification-consumer
    command: ["python", "manage.py", "consume_events"]
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      MVP_NOTIFICATION_BACKEND: ${MVP_NOTIFICATION_BACKEND}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,notification-service

  patient-service:
    <<: *django-service
    build: ./services/patient-service
    container_name: samr-patient
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: patient_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,patient-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  solicitud-service:
    <<: *django-service
    build: ./services/solicitud-service
    container_name: samr-solicitud
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: solicitud_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      MVP_FAQ_CONFIDENCE_THRESHOLD: ${MVP_FAQ_CONFIDENCE_THRESHOLD}
      MVP_CONSORTIUM_OUTCOME: ${MVP_CONSORTIUM_OUTCOME}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,solicitud-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  monitoring-service:
    <<: *django-service
    build: ./services/monitoring-service
    container_name: samr-monitoring
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: monitoring_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      MVP_DEVICE_SERVICE_TOKEN: ${MVP_DEVICE_SERVICE_TOKEN}
      MVP_VITAL_THRESHOLDS: ${MVP_VITAL_THRESHOLDS}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,monitoring-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  evaluacion-service:
    <<: *django-service
    build: ./services/evaluacion-service
    container_name: samr-evaluacion
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: evaluacion_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      MVP_DEFAULT_RISK_LEVEL: ${MVP_DEFAULT_RISK_LEVEL}
      MVP_CRITICAL_TERMS: ${MVP_CRITICAL_TERMS}
      MVP_HIGH_TERMS: ${MVP_HIGH_TERMS}
      PATIENT_SERVICE_URL: ${PATIENT_SERVICE_URL}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,evaluacion-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  teleconsult-service:
    <<: *django-service
    build: ./services/teleconsult-service
    container_name: samr-teleconsult
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: teleconsult_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,teleconsult-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  emergency-service:
    <<: *django-service
    build: ./services/emergency-service
    container_name: samr-emergency
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: emergency_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      MVP_FIRST_AID_GUIDE: ${MVP_FIRST_AID_GUIDE}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,emergency-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  cierre-caso-service:
    <<: *django-service
    build: ./services/cierre-caso-service
    container_name: samr-cierre-caso
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: cierre_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,cierre-caso-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  historial-interop-service:
    <<: *django-service
    build: ./services/historial-interop-service
    container_name: samr-historial-interop
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: historial_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      PATIENT_SERVICE_URL: ${PATIENT_SERVICE_URL}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOST: localhost,nginx,historial-interop-service
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  audit-service:
    <<: *django-service
    build: ./services/audit-service
    container_name: samr-audit
    environment:
      DB_HOST: samr-postgres
      POSTGRES_HOST: samr-postgres
      DB_PORT: "5432"
      DB_NAME: audit_db
